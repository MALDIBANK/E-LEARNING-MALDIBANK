<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="seal">E</span> Course</div>
    <nav>
      <a href="dashboard.html">← Back to dashboard</a>
      <a href="#" data-sign-out>Sign out</a>
    </nav>
  </div>

  <div class="wrap center">
    <h1>Certificate of completion</h1>
    <div id="content" class="card">Checking your exam result…</div>
  </div>

  <script type="module">
    import { supabase } from "./assets/js/supabase-client.js";
    import { requireAuth, wireSignOutButtons } from "./assets/js/auth.js";

    wireSignOutButtons();
    const auth = await requireAuth();
    if (auth) {
      const { session, profile } = auth;
      const content = document.getElementById("content");

      const { data: attempts } = await supabase
        .from("exam_attempts")
        .select("score, passed, submitted_at")
        .eq("user_id", session.user.id)
        .eq("passed", true)
        .order("submitted_at", { ascending: false })
        .limit(1);

      if (!attempts || !attempts.length) {
        content.innerHTML = `<p>You haven't passed the exam yet.</p><a class="btn btn-primary" href="exam.html">Take the exam</a>`;
      } else {
        let { data: cert } = await supabase
          .from("certificates")
          .select("*")
          .eq("user_id", session.user.id)
          .maybeSingle();

        if (!cert) {
          const code = crypto.randomUUID().split("-")[0].toUpperCase();
          const { data: inserted, error } = await supabase
            .from("certificates")
            .insert({ user_id: session.user.id, certificate_code: code })
            .select()
            .single();
          if (!error) cert = inserted;
        }

        const name = profile?.full_name || session.user.email;
        const date = new Date(cert?.issued_at || Date.now()).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });

        content.innerHTML = `
          <p class="muted">Issued to</p>
          <h2 style="font-size:2rem;">${name}</h2>
          <p class="muted">on ${date} · Certificate code <span class="mono">${cert?.certificate_code || "—"}</span></p>
          <div class="spacer"></div>
          <button id="download-btn" class="btn btn-brass">Download PDF certificate</button>
        `;

        document.getElementById("download-btn").addEventListener("click", async () => {
          const { jsPDF } = await import("https://cdn.jsdelivr.net/npm/jspdf@2.5.1/+esm");
          const doc = new jsPDF({ orientation: "landscape", unit: "pt", format: "a4" });
          const w = doc.internal.pageSize.getWidth();
          const h = doc.internal.pageSize.getHeight();

          doc.setDrawColor(184, 134, 62);
          doc.setLineWidth(3);
          doc.rect(24, 24, w - 48, h - 48);
          doc.setLineWidth(1);
          doc.rect(34, 34, w - 68, h - 68);

          doc.setFont("times", "bold");
          doc.setFontSize(14);
          doc.setTextColor(120, 120, 120);
          doc.text("CERTIFICATE OF COMPLETION", w / 2, 120, { align: "center" });

          doc.setFont("times", "italic");
          doc.setFontSize(16);
          doc.setTextColor(20, 36, 51);
          doc.text("This certifies that", w / 2, 170, { align: "center" });

          doc.setFont("times", "bold");
          doc.setFontSize(34);
          doc.text(name, w / 2, 215, { align: "center" });

          doc.setFont("times", "normal");
          doc.setFontSize(15);
          doc.text("has successfully completed the course and passed the final exam", w / 2, 250, { align: "center" });

          doc.setFontSize(12);
          doc.setTextColor(100, 100, 100);
          doc.text(`Issued ${date}`, w / 2, 300, { align: "center" });
          doc.text(`Certificate code: ${cert?.certificate_code || ""}`, w / 2, 320, { align: "center" });

          doc.save(`certificate-${(cert?.certificate_code || "course")}.pdf`);
        });
      }
    }
  </script>
</body>
</html>
